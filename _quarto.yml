project:
  type: book
  output-dir: _site
  render:
    - "index.qmd"
    - "sitzung*/*.qmd"
    - "anhang/*.qmd"
    - "materials/codebook.qmd"
  resources:
    - "materials/*.csv"
    - "assets/mathjax/tex-svg-full.js"

book:
  title: "M15: Quantitative Forschungsmethoden"
  subtitle: "Online-Seminar HMU, 10 Sitzungen"
  author: "Hannes Diemerling"
  repo-url: https://github.com/hannesdiemerling/QuantMaster
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Sitzung 01 · Setup & Datenerhebung"
      chapters:
        - sitzung01/00-uebersicht.qmd
        - sitzung01/01-open-science.qmd
        - sitzung01/02-forschungsethik.qmd
        - sitzung01/03-messtheorie-bfi-k.qmd
        - sitzung01/04-fragebogen-einverstaendnis.qmd
        - sitzung01/05-github-einstieg.qmd
        - sitzung01/06-datensatz-laden.qmd
        - sitzung01/07-datenbereinigung-jasp.qmd
        - sitzung01/08-hochladen.qmd
        - sitzung01/99-abschluss.qmd
    - part: "Sitzung 02 · Gesamtdatensatz & Deskription"
      chapters:
        - sitzung02/00-uebersicht.qmd
        - sitzung02/01-uploads-kombinieren.qmd
        - sitzung02/02-deskriptive-plots.qmd
        - sitzung02/99-abschluss.qmd
    - part: "Sitzung 03 · Skalen & Effektgrößen"
      chapters:
        - sitzung03/00-uebersicht.qmd
        - sitzung03/01-skalen-bilden.qmd
        - sitzung03/02-korrelation.qmd
        - sitzung03/03-t-tests.qmd
        - sitzung03/99-abschluss.qmd
    - part: "Sitzung 04 · Metaanalyse & multiple Regression"
      chapters:
        - sitzung04/00-uebersicht.qmd
        - sitzung04/01-metaanalyse.qmd
        - sitzung04/02-multiple-regression.qmd
        - sitzung04/03-moderation.qmd
        - sitzung04/99-abschluss.qmd
    - part: "Sitzung 05 · Mehrebenenmodelle & Faktorenanalyse"
      chapters:
        - sitzung05/00-uebersicht.qmd
        - sitzung05/01-mixed-models.qmd
        - sitzung05/02-faktorenanalyse.qmd
        - sitzung05/99-abschluss.qmd
    - part: "Sitzung 06 · Struktur­gleichungs­modelle"
      chapters:
        - sitzung06/00-uebersicht.qmd
        - sitzung06/01-cfa-sem.qmd
        - sitzung06/02-mediation-bootstrap.qmd
        - sitzung06/99-abschluss.qmd
    - part: "Sitzung 07 · Versuchsplanung, Stichprobe & Power"
      chapters:
        - sitzung07/00-uebersicht.qmd
        - sitzung07/01-stichprobe-bias.qmd
        - sitzung07/02-versuchsplanung-power.qmd
        - sitzung07/03-anova.qmd
        - sitzung07/99-abschluss.qmd
    - part: "Sitzung 08 · Signifikanztest-Kritik & Bayes"
      chapters:
        - sitzung08/00-uebersicht.qmd
        - sitzung08/01-signifikanztest-kritik.qmd
        - sitzung08/02-bayes.qmd
        - sitzung08/99-abschluss.qmd
    - part: "Sitzung 09 · Intervention & Epidemiologie"
      chapters:
        - sitzung09/00-uebersicht.qmd
        - sitzung09/01-logistische-regression.qmd
        - sitzung09/02-intervention-epidemiologie.qmd
        - sitzung09/99-abschluss.qmd
    - part: "Sitzung 10 · Qualitative Methoden & Abschluss"
      chapters:
        - sitzung10/00-uebersicht.qmd
        - sitzung10/01-qualitative-methoden.qmd
        - sitzung10/02-zusammenfassung.qmd
        - sitzung10/99-abschluss.qmd
    - part: "Anhang (freiwillig)"
      chapters:
        - anhang/01-machine-learning.qmd
        - anhang/02-weitere-verfahren.qmd
    - part: "Referenz"
      chapters:
        - materials/codebook.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    callout-appearance: default
    fig-responsive: true
    link-external-newwindow: true
    # MathJax liegt lokal im Repo, damit Formeln auch ohne CDN (Werbeblocker, Firmennetz) rendern
    html-math-method:
      method: mathjax
      url: "assets/mathjax/tex-svg-full.js"

execute:
  freeze: auto
  echo: true
  warning: false

lang: de

filters:
  - filters/nowrap-math.lua

# Zentrale Kursdaten — in den Kapiteln per {{< meta kurs.mail >}} eingebunden
kurs:
  mail: "hannes.diemerling@gmail.com"
  repo: "https://github.com/HannesDiemerling/QuantMaster"
