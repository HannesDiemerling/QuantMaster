name: Datensatz einfrieren

# Friert den aktuellen Gesamtdatensatz für eine Gruppe ein: Actions > "Datensatz
# einfrieren" > "Run workflow" > Gruppenname. Der Lauf repariert Kopien aller Uploads
# (scripts/repair-uploads.py) und führt darüber einen eigenen Merge aus, enthält also
# alles, was in dem Moment in data/student-uploads/ liegt. Originale und Live-Stand
# bleiben unberührt.
# Ergebnis: data/combined/eingefroren/<gruppe>/ (samt pruefbericht.md).
# Ein vorhandener Ordner wird nie überschrieben.
on:
  workflow_dispatch:
    inputs:
      gruppe:
        description: "Name der Gruppe (Kleinbuchstaben, Ziffern, Bindestriche), z. B. hannes"
        required: true
        type: string

permissions:
  contents: write

# Eigene Gruppe statt "merge-uploads": Dort würde ein wartender Lauf von neuen
# Uploads verdrängt. Es wird nur der neue Ordner committet, Konflikte mit dem
# Merge sind damit ausgeschlossen.
concurrency:
  group: freeze-${{ inputs.gruppe }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin
      GRUPPE: ${{ inputs.gruppe }}
    steps:
      - name: Checkout (aktueller Stand von main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Beide Schritte dürfen hier scheitern. Der Schritt „Einfrieren und prüfen“ bricht dann mit
      # klarer Meldung ab und schreibt nichts, der Lauf lässt sich einfach neu starten.
      - name: Pakete für Numbers und Excel
        continue-on-error: true
        run: python -m pip install -q "numbers-parser==4.22.2" "openpyxl==3.1.5"

      - name: Uploads reparieren
        continue-on-error: true
        run: python scripts/repair-uploads.py data/student-uploads "$RUNNER_TEMP/repariert"

      - name: Einfrieren und prüfen
        run: Rscript scripts/freeze-dataset.R "$GRUPPE" "$RUNNER_TEMP/repariert"

      # Nur der neue Ordner wird committet. Der Live-Stand bleibt Sache des Merge-Workflows.
      - name: Commit frozen dataset
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/combined/eingefroren/$GRUPPE"
          git commit -q -m "chore(data): Datensatz für Gruppe $GRUPPE eingefroren"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH"; then echo "gepusht (Versuch $i)"; exit 0; fi
            echo "Push fehlgeschlagen, neuer Versuch"; sleep $((i * 5))
          done
          exit 1
