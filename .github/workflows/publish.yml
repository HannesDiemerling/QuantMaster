name: Deploy to Pages

on:
  push:
    branches: [main, master]
    # Nur rendern, wenn sich etwas ändert, das Quarto für die Site liest.
    # Uploads, Abgaben, Skripte und README lösen keinen Lauf aus.
    # Neuer Ordner mit Site-Inhalt (z. B. Bilder)? Hier ergänzen.
    # Von Hand neu bauen: Actions → „Deploy to Pages“ → „Run workflow“.
    paths:
      - '_*.yml'          # _quarto.yml, ggf. _brand.yml, _variables.yml
      - '*.qmd'
      - '*.css'
      - '*.scss'
      - '_brand/**'
      - '_extensions/**'
      - 'sitzung*/**'
      - 'anhang/**'
      - 'materials/**'
      - 'filters/**'
      - 'assets/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kein Python nötig: Die Kapitel haben keine ausführbaren Code-Zellen.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26   # dieselbe Version wie lokal getestet; nur bewusst anheben

      - name: Render Quarto Book (HTML)
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
