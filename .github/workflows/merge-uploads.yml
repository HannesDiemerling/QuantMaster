name: Merge student uploads

# Kombiniert alle Studierenden-Uploads zu data/combined/m15-gesamt.csv und
# schreibt data/combined/merge-report.md (was wurde erkannt, welche Probleme).
# Läuft bei jedem Push, der eine CSV-Datei betrifft. Verwendet werden nur Dateien
# aus data/student-uploads/; CSVs anderswo stehen als IGNORIERT im Report.
# Manuell startbar über Actions > "Run workflow".
on:
  push:
    branches: [main, master]
    paths:
      - '**.csv'
      - '**.CSV'
      - 'data/student-uploads/**'
      - '!data/combined/**'
      - 'scripts/merge-uploads.R'
      - 'scripts/meta-studien.R'
      - '.github/workflows/merge-uploads.yml'
  workflow_dispatch:

permissions:
  contents: write

# Immer nur ein Lauf gleichzeitig. Ein laufender Merge wird NICHT abgebrochen
# (sonst käme bei vielen Uploads hintereinander nie ein Lauf durch); es wartet
# höchstens ein weiterer Lauf, und der liest dann den neuesten Stand von main.
concurrency:
  group: merge-uploads
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin   # Uhrzeit im Merge-Report in deutscher Zeit
    steps:
      - name: Checkout (aktueller Stand von main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Merge uploads
        run: Rscript scripts/merge-uploads.R

      # Während des Laufs können weitere Uploads auf main landen. Deshalb vor dem
      # Push den neuen Stand holen (rebase) und bei Bedarf erneut versuchen.
      # data/combined/ wird nur von diesem Workflow geschrieben, es gibt also
      # keine Konflikte; neuere Uploads verarbeitet der nächste Lauf.
      - name: Commit combined dataset
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/combined/m15-gesamt.csv data/combined/merge-report.md data/combined/meta-studien.csv
          if git diff --cached --quiet; then echo "Keine Änderungen am Gesamtdatensatz"; exit 0; fi
          git commit -q -m "chore(data): Gesamtdatensatz aktualisiert"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH"; then echo "gepusht (Versuch $i)"; exit 0; fi
            echo "Push fehlgeschlagen, neuer Versuch"; sleep $((i * 5))
          done
          exit 1
