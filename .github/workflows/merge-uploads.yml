name: Merge student uploads

# Kombiniert alle Studierenden-Uploads zu data/combined/m15-gesamt.csv und
# schreibt data/combined/merge-report.md (was wurde erkannt, welche Probleme).
# Läuft bei jedem Push, der eine CSV-Datei betrifft — auch wenn sie im falschen
# Ordner gelandet ist. Manuell startbar über Actions > "Run workflow".
on:
  push:
    branches: [main, master]
    paths:
      - '**.csv'
      - '**.CSV'
      - '!data/combined/**'
      - 'scripts/merge-uploads.R'
      - '.github/workflows/merge-uploads.yml'
  workflow_dispatch:

permissions:
  contents: write

# Laden viele Studierende gleichzeitig hoch, reicht der jeweils letzte Lauf —
# er liest immer den aktuellen Stand von main.
concurrency:
  group: merge-uploads
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (aktueller Stand von main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Merge uploads
        run: Rscript scripts/merge-uploads.R

      - name: Commit combined dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): Gesamtdatensatz aktualisiert"
          file_pattern: |
            data/combined/m15-gesamt.csv
            data/combined/merge-report.md
            data/combined/meta-studien.csv
