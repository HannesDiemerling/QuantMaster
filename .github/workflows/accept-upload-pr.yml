name: Accept student upload PR

# Studierende ohne Schreibrechte laden über „Add file → Create new file“ hoch; GitHub macht
# daraus einen Pull Request aus ihrem Fork. Dieser Workflow übernimmt ihn automatisch, wenn er
# nur Upload-Dateien in data/student-uploads/ enthält (Prüfung: scripts/check-upload-pr.py),
# und startet danach den Merge. Alles andere bleibt offen und bekommt einen Kommentar.
#
# Sicherheit: pull_request_target läuft mit dem Code von main. Aus dem Pull Request wird
# NICHTS ausgecheckt oder ausgeführt, nur seine Dateiliste über die API gelesen.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: accept-upload-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (nur main, kein Code aus dem Pull Request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Pull Request prüfen und übernehmen
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api --paginate --slurp "repos/$REPO/pulls/$PR/files" > files.json
          if python3 scripts/check-upload-pr.py files.json "$AUTHOR" "$REPO" > result.txt; then
            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch=false
            gh workflow run merge-uploads.yml --repo "$REPO" --ref "$BRANCH"
            gh pr comment "$PR" --repo "$REPO" --body "Danke, Dein Upload ist übernommen. In ein paar Minuten steht er im [Merge-Report](https://github.com/$REPO/blob/$BRANCH/data/combined/merge-report.md). Such dort nach Deiner Kennziffer."
          else
            { echo "Dieser Pull Request wurde nicht automatisch übernommen:"; echo; tail -n +2 result.txt; echo;
              echo "Bitte nur Deine eigene CSV-Datei in \`data/student-uploads/\` anlegen. Bei Fragen die Lehrperson ansprechen."; } > comment.md
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md
            cat result.txt
          fi
